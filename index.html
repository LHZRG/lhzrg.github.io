<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语林集 · 门扉之前</title><!-- ★改这里：浏览器标签页上的标题 -->
    <meta name="description" content="午后斜阳里的一间小馆。写字、拍照、慢慢生活。" /><!-- ★改这里：搜索结果里显示的一句话介绍 -->
    <meta name="theme-color" content="#f2e6d2" /><!-- 手机浏览器地址栏颜色，跟着背景色走就行 -->
    <!-- 浏览器小图标（橙色方块里一个「语」字）。想换别的字：把下面两处「语」改掉即可 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c99a63'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff8ec' font-family='serif'%3E语%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./assets/css/loading.css" />
  </head>
  <!-- ============================================================
       加载页（index.html）
       这一页是进站前的封面。要改的东西主要在两处：
         ① 下面标了 ★改这里 的文字（站名、英文名、按钮、页脚）
         ② 轮播的美句：assets/js/data.js 里的 QUOTES
         ③ 背景大图：assets/img/loading.jpg（换图时把新图改名成 loading.jpg 覆盖即可）
           想换背景图路径 → assets/css/loading.css 里搜 loading.jpg
       样式都在 assets/css/loading.css
       ============================================================ -->
  <body>
    <div class="stage">
      <div class="bg"></div>
      <div class="veil"></div>
      <div class="dust" id="dust"></div>

      <header class="top">
        <div class="mark">语</div><!-- ★改这里：左上角圆印章里的字，一般取站名第一个字 -->
        <div>
          <div class="t1">语林集</div><!-- ★改这里：左上角的站点名称 -->
          <div class="t2">YU LIN JI · 2026</div><!-- ★改这里：名称下面的英文小字，可写成 owner · since 2026 之类 -->
        </div>
      </header>

      <main class="center">
        <!-- 句子区域：这里的文字只是「第一句」的占位，页面打开后会被 data.js 的 QUOTES 覆盖 -->
        <div class="quote" id="quote">
          <span class="q-mark">“</span>
          <p class="q-text" id="qText">午后是一天里最宽容的时刻。</p>
          <p class="q-by" id="qBy">—— 语林集</p>
        </div>

        <div class="loader">
          <div class="bar"><i id="barFill"></i></div>
          <div class="status">
            <!-- 阶段提示文案在 assets/js/loading.js 的 STATUS 数组里改 -->
            <span id="status">正在擦亮玻璃…</span><span id="pct">0%</span>
          </div>
        </div>

        <button class="door" id="door" disabled>
          <span>推 门 而 入</span><i class="arrow">→</i><!-- ★改这里：进门按钮上的字（字之间加空格会显得更舒展） -->
        </button>
        <div class="hint" id="hint">正在准备，请稍候</div>
      </main>

      <footer class="bot">
        <span>© 2026 大大大椰子</span><!-- ★改这里：左下角版权署名 -->
        <span>喵喵喵？</span><!-- ★改这里：右下角一句话 -->
      </footer>
    </div>

    <div class="wipe" id="wipe"></div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/loading.js"></script>

    <!-- ============================================================
         ★ 保险丝（建议保留）
         作用：万一 data.js 里手滑漏了个逗号或引号，整个脚本会崩，
               加载页就会一直卡在 0%，把人挡在门外干瞪眼。
               这段脚本独立于上面两个文件单独运行，即使它们报错也会执行：
               · 发现 data.js 没读进来 → 立刻弹提示，告诉你去查哪里
               · 超过 5 秒还是 0%   → 自动放行进首页，不至于卡死
         网站一切正常时，它什么都不做，不会打扰你。
         ============================================================ -->
    <script>
      (function () {
        var jumped = false;
        function tip(msg) {
          if (document.getElementById("yljSafeTip")) return;
          var b = document.createElement("div");
          b.id = "yljSafeTip";
          b.style.cssText =
            "position:fixed;z-index:99;left:50%;top:16px;transform:translateX(-50%);" +
            "max-width:min(92vw,520px);padding:12px 18px;border-radius:12px;" +
            "background:#fff4ee;border:1px solid #e2a58c;color:#6f3320;" +
            "font:13px/1.75 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;text-align:center";
          b.innerHTML = msg;
          document.body.appendChild(b);
        }
        function go() {
          if (jumped) return;
          jumped = true;
          location.href = "./home.html";
        }
        // ① data.js 或 loading.js 崩了 —— 800ms 就能判断出来
        setTimeout(function () {
          if (typeof SITE === "undefined" || typeof QUOTES === "undefined") {
            tip(
              "像是 <b>assets/js/data.js</b> 里有语法错误（大概漏了逗号或引号），<br>" +
                "请打开它检查一下最后改动的那几行。<br>5 秒后先放你进去。"
            );
            setTimeout(go, 5000);
          }
        }, 800);
        // ② 文件没毛病，但进度迟迟不动（比如某个图片地址卡住）
        setTimeout(function () {
          var el = document.getElementById("pct");
          if (el && el.textContent.replace("%", "").trim() === "0") {
            tip("加载似乎卡住了，先带你进首页看看。");
            setTimeout(go, 5000);
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
