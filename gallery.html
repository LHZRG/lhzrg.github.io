    <!-- 图片页文案：content/pages/gallery.js；照片：content/gallery/photos.js。 详细说明见 content/README.md。 -->
    <main style="padding-top: 46px">
      <div class="wrap">
        <div class="divider-leaf" style="margin-top: 10px" data-copy="text01">拍 的 光</div><!-- ★改这里：栏目标题 -->
        <div class="sec-head">
          <div>
            <h2 class="sec-title" data-copy="text02">图片墙</h2><!-- ★改这里：标题 -->
            <p style="color: var(--ink-3); font-size: 14px; margin: 6px 0 0">
              共 <b id="shotNum">0</b> 张 · 点开可放大，用 ← → 翻页，ESC 退出<!-- ★改这里：副标题（张数自动填） -->
            </p>
          </div>
          <button class="more-link" id="shuffle" data-copy="text03">随机看一张</button><!-- ★改这里：右上角按钮文字 -->
        </div>

        <div class="masonry" id="galleryGrid"></div><!-- ← 瀑布流，数据来自 content/ 的 GALLERY -->

        <div class="note-card" style="margin-top: 34px">
          <h3 data-copy="text04">关于这些照片</h3><!-- ★改这里：卡片标题 -->
          <p style="margin: 0" data-copy="text05">
            <!-- ★改这里：照片说明，随便改成你自己的拍摄心得 -->
            众所周知，光是什么样的，照片就是什么样的。
          </p>
        </div>
      </div>
