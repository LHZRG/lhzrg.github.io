<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片 · 语林集</title>
    <meta name="description" content="午后光线落在桌上的样子。" />
    <meta name="theme-color" content="#f7f1e6" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c99a63'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff8ec' font-family='serif'%3E语%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body>
    <div id="nav"></div>

    <!-- ============================================================
         「图片」相册页
         照片全部来自 data.js 第 4 段 GALLERY。
         👉 加 / 删照片：data.js 的 GALLERY（图片本体放 assets/img/ 文件夹）
         ============================================================ -->
    <main style="padding-top: 46px">
      <div class="wrap">
        <div class="divider-leaf" style="margin-top: 10px">拍 的 光</div><!-- ★改这里：栏目标题 -->
        <div class="sec-head">
          <div>
            <h2 class="sec-title">图片墙</h2><!-- ★改这里：标题 -->
            <p style="color: var(--ink-3); font-size: 14px; margin: 6px 0 0">
              共 <b id="shotNum">0</b> 张 · 点开可放大，用 ← → 翻页，ESC 退出<!-- ★改这里：副标题（张数自动填） -->
            </p>
          </div>
          <button class="more-link" id="shuffle">随机看一张</button><!-- ★改这里：右上角按钮文字 -->
        </div>

        <div class="masonry" id="galleryGrid"></div><!-- ← 瀑布流，数据来自 data.js 的 GALLERY -->

        <div class="note-card" style="margin-top: 34px">
          <h3>关于这些照片</h3><!-- ★改这里：卡片标题 -->
          <p style="margin: 0">
            <!-- ★改这里：照片说明，随便改成你自己的拍摄心得 -->
            众所周知，光是什么样的，照片就是什么样的。
          </p>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/markdown.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/pages/gallery.js"></script>
  </body>
</html>
